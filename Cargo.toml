[package]
name = "xenomit-game-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Client-agnostic game state and action API with a Xenomit bridge adapter"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }
